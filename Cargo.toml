[package]
name = "codequality-rs"
version = "0.1.0"
edition = "2021"
authors = ["dev-cli contributors"]
license = "MIT"
description = "Fast code quality analyzer for Python. Built in Rust, no AI, no API costs."
readme = "README.md"
repository = "https://github.com/morata43-png/codequality-rs"
keywords = ["linter", "code-quality", "static-analysis", "python", "rust"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "codequality_rs"
path = "src/lib.rs"

[[bin]]
name = "codequality"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
ignore = "0.4"
tree-sitter = "0.20"
tree-sitter-python = "0.20"
anyhow = "1.0"
rayon = "1.8"
tera = "1.19"
rustc-hash = "1.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3.8"
predicates = "3.1"
